# Sveltia CMS — the phone-friendly editor at /admin
backend:
  name: github
  repo: devonbuse/annieguyphotography
  branch: main
  # Optional: one-tap GitHub login (see SETUP.md, step 5). Without it, sign in with an access token.
  # base_url: https://sveltia-cms-auth.YOUR-ACCOUNT.workers.dev

site_url: https://annieguyphotography.devon-80e.workers.dev
display_url: https://annieguyphotography.devon-80e.workers.dev

# Every uploaded photo lands here. Paths are written relative to the content files.
media_folder: src/assets/uploads
public_folder: ../../assets/uploads

# Shrink phone photos BEFORE they're saved (keeps the repo small and uploads fast on cell data).
media_libraries:
  default:
    config:
      max_file_size: 30000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2560
          height: 2560

collections:
  - name: galleries
    label: Galleries
    label_singular: Gallery
    description: Tap "New Gallery", add a title and cover, then tap Photos to pick several pictures at once.
    folder: src/content/galleries
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} — {{category}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, type: date, default: "{{now}}" }
      - name: category
        label: Category
        widget: select
        options: [Seniors, Sportraits, Families, Branding, Other]
        default: Other
      - { name: cover, label: Cover photo, widget: image }
      - { name: photos, label: Photos (select as many as you like), widget: image, multiple: true }
      - { name: description, label: Short description (optional), widget: text, required: false }
      - { name: featured, label: Show on home page?, widget: boolean, default: true, required: false }
      - { name: draft, label: Hide for now, widget: boolean, default: false, required: false }

  - name: blog
    label: Blog
    label_singular: Post
    description: Just a title, a few words, and some photos is plenty. The date fills in automatically.
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: cover, label: Cover photo (optional), widget: image, required: false }
      - { name: body, label: Write your post, widget: markdown, required: false }
      - { name: photos, label: Photos to show under the post (optional), widget: image, multiple: true, required: false }
      - { name: date, label: Date, widget: datetime, type: date, default: "{{now}}" }
      - { name: excerpt, label: Short summary (optional — made automatically if blank), widget: text, required: false }
      - { name: draft, label: Hide for now, widget: boolean, default: false, required: false }

  - name: site
    label: Site Settings
    files:
      - name: home
        label: Home page, About & Contact info
        file: src/content/site/home.md
        fields:
          - { name: businessName, label: Business name, widget: string }
          - { name: photographer, label: Photographer name, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: tagline, label: Headline over the photos, widget: string }
          - { name: heroImages, label: Home page slideshow photos (3–6 is ideal), widget: image, multiple: true, min: 1, max: 8 }
          - { name: intro, label: Intro line, widget: text }
          - { name: categories, label: Session-type buttons under the slideshow, widget: list, required: false }
          - { name: aboutImage, label: About photo, widget: image, required: false }
          - { name: about, label: About text, widget: text }
          - name: services
            label: Services
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text }
          - name: steps
            label: How it works (steps)
            widget: list
            required: false
            fields:
              - { name: title, label: Step, widget: string }
              - { name: text, label: Description, widget: text }
          - name: packages
            label: Packages & pricing
            widget: list
            required: false
            fields:
              - { name: name, label: Package name, widget: string }
              - { name: label, label: Small label (e.g. Most popular), widget: string, required: false }
              - { name: price, label: Price (e.g. $175), widget: string }
              - { name: bestFor, label: Best for (one short line), widget: string, required: false }
              - { name: features, label: What's included, widget: list }
              - { name: popular, label: Highlight this one?, widget: boolean, default: false, required: false }
          - { name: packagesNote, label: Note under packages, widget: string, required: false }
          - name: faqs
            label: Questions & answers (FAQ)
            widget: list
            required: false
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
          - name: testimonials
            label: Kind words (client reviews — section appears once you add one)
            widget: list
            required: false
            fields:
              - { name: quote, label: What they said, widget: text }
              - { name: name, label: Client name, widget: string }
          - { name: phone, label: Phone (shows Call buttons when filled in), widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: facebook, label: Facebook link, widget: string, required: false }
          - { name: instagram, label: Instagram link, widget: string, required: false }
          - { name: messenger, label: Messenger link, widget: string, required: false }
          - { name: googleFormLink, label: Google Form pre-filled link (turns on the contact form — see SETUP.md), widget: string, required: false }
